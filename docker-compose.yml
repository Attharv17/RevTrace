version: "3.9"

networks:
  revtrace_net:
    driver: bridge

volumes:
  postgres_data:

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: revtrace_postgres
    environment:
      POSTGRES_USER: revtrace
      POSTGRES_PASSWORD: revtrace
      POSTGRES_DB: revtrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - revtrace_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revtrace -d revtrace"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: revtrace_backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://revtrace:revtrace@postgres:5432/revtrace
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - revtrace_net
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── React Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: revtrace_frontend
    ports:
      - "5173:5173"
    networks:
      - revtrace_net
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    command: npm run dev -- --host
